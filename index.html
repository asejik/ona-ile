<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#E6CFA8" />
    <title>Ọ̀nà Ilé: The Last Delivery</title>
    <meta name="description" content="Drive Baba's keke through the real streets of Ilorin." />
  </head>
  <body>
    <div id="app">
      <canvas id="gl" aria-label="The street view as you drive"></canvas>

      <div id="loading" class="screen">
        <div class="card">
          <p class="eyebrow">Post Office and Unity Road</p>
          <p class="title">Ọ̀nà Ilé</p>
          <p>Loading the map…</p>
        </div>
      </div>

      <div id="error" class="screen" hidden>
        <div class="card" role="alert">
          <p id="errorText"></p>
          <button id="retry" class="btn">Retry</button>
        </div>
      </div>

      <div id="hud" hidden>
        <div id="street" class="sign" hidden></div>
        <div class="chip speed"><span id="speed">0</span> <small>km/h</small></div>
        <div class="controls" aria-label="Driving controls">
          <div class="cluster">
            <button class="ctl" data-ctl="left" aria-label="Steer left">◀</button>
            <button class="ctl" data-ctl="right" aria-label="Steer right">▶</button>
          </div>
          <div class="cluster">
            <button class="ctl" data-ctl="brake" aria-label="Brake and reverse">Brake</button>
            <button class="ctl" data-ctl="gas" aria-label="Accelerate">Gas</button>
          </div>
        </div>
        <p class="chip credit">
          Map data ©
          <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener"
            >OpenStreetMap contributors</a
          >
          · <a href="./privacy.html">Privacy</a>
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
