name: CI

# Once per change: on pull requests, and on main after a merge. (Running on every push as well ran each
# PR twice.)
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read  # gitleaks-action lists the PR's commits

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  zone:
    name: Zone data rebuilds from the pinned OSM extract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Rebuild zone1 and compare
        run: |
          python -I baba-keke/tools/build_zone.py data/osm/zone1-post-office_2026-11-07.json "$RUNNER_TEMP/zone1.js"
          diff <(tr -d '\r' < "$RUNNER_TEMP/zone1.js") <(tr -d '\r' < baba-keke/zone1.js) > /dev/null \
            || { echo "zone1.js differs from what build_zone.py produces. Regenerate it, don't hand-edit."; exit 1; }
          echo "zone1.js matches the pipeline output."
      - name: Rebuild the game's zone JSON and compare
        run: |
          python -I tools/build_zone.py data/osm/zone1-post-office_2026-11-07.json "$RUNNER_TEMP/zone1.json" content/zones/zone1-post-office.overrides.json
          cmp "$RUNNER_TEMP/zone1.json" public/zones/zone1-post-office.json \
            || { echo "public/zones/zone1-post-office.json differs from the pipeline output. Run npm run zone, don't hand-edit."; exit 1; }
          echo "zone1-post-office.json matches the pipeline output."

  app:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Dependency audit (fails on high or critical)
        run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    # The browser tests draw the 3D game on the CPU (no GPU on CI), so they are split across machines that
    # run at the same time. Each machine builds the game and runs its share.
    name: Browser tests (${{ matrix.shard }} of 4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Browser tests (phone and desktop)
        run: npx playwright test --shard=${{ matrix.shard }}/4
      - name: Keep screenshots and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  done:
    # One check that is green only when every job above is: the one to require before merging.
    name: All checks passed
    if: always()
    needs: [secrets, zone, app, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job passed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "A required job did not pass: ${{ join(needs.*.result, ', ') }}"
          exit 1
      - run: echo "All checks passed."
